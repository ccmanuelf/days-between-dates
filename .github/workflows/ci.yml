name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the page's packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check the page's types
        working-directory: frontend
        run: npm run typecheck
      - name: The page's unit tests
        working-directory: frontend
        run: npm test
      - name: Build the page
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Install the browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest -v

  # The app as compose.yaml runs it: built from the Dockerfile, its data in the named volume. A required check on main.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and start
        run: docker compose up --build -d
      - name: The container serves the page, its assets and a known answer
        run: python scripts/docker_check.py serves http://127.0.0.1:8765
      - name: Recreate the container
        run: docker compose down && docker compose up -d
      - name: The data came back from the volume
        run: python scripts/docker_check.py kept http://127.0.0.1:8765
      - name: Clean up
        if: always()
        run: docker compose down -v --rmi local
