<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Days between dates</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <span class="field">
      <label for="language" data-i18n="language_label"></label>
      <select id="language">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </span>
  </header>

  <main>
    <details id="help" class="card guide">
      <summary id="help-toggle" data-i18n="help_title"></summary>
      <div id="help-body" class="reveal"></div>
    </details>

    <section class="card">
      <form id="count-form" class="form-grid">
        <span class="field">
          <label for="start" data-i18n="start_label"></label>
          <input id="start" autocomplete="off" data-i18n-placeholder="date_hint">
        </span>
        <span class="field">
          <label for="end" data-i18n="end_label"></label>
          <input id="end" autocomplete="off" data-i18n-placeholder="date_hint">
        </span>
        <span class="field">
          <label for="calendar" data-i18n="calendar_label"></label>
          <select id="calendar">
            <option value="mx" data-i18n="calendar_mx"></option>
            <option value="us" data-i18n="calendar_us"></option>
          </select>
        </span>
        <button id="count" type="submit" class="primary" data-i18n="count_button"></button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <p id="announce" class="visually-hidden" role="status" aria-atomic="true"></p>

    <section id="result" class="card result" hidden>
      <div class="result-head">
        <p id="active-calendar" class="result-calendar"></p>
        <p id="range" class="result-range"></p>
      </div>
      <p id="notice-swapped" class="notice" data-i18n="notice_swapped" hidden></p>
      <p id="notice-past-years" class="notice" data-i18n="notice_past_years" hidden></p>
      <table>
        <thead>
          <tr><th></th><th data-i18n="col_start_not_counted"></th><th data-i18n="col_both_counted"></th></tr>
        </thead>
        <tbody>
          <tr><th data-i18n="row_total"></th><td id="total-snc"></td><td id="total-bc"></td></tr>
          <tr><th data-i18n="row_business"></th><td id="business-snc"></td><td id="business-bc"></td></tr>
        </tbody>
      </table>
      <details id="how-total" class="how">
        <summary id="how-total-toggle" data-i18n="how_total_title"></summary>
        <div class="how-body reveal">
          <p class="how-text"></p>
          <p class="how-example" hidden></p>
        </div>
      </details>
      <details id="how-business" class="how">
        <summary id="how-business-toggle" data-i18n="how_business_title"></summary>
        <div class="how-body reveal">
          <p class="how-text"></p>
          <p class="how-example" hidden></p>
        </div>
      </details>
      <p id="note-local-elections" class="note" data-i18n="note_local_elections" hidden></p>
      <p id="note-business-days" class="note" data-i18n="note_business_days" hidden></p>
    </section>

    <section id="own" class="card">
      <h2 id="own-title"></h2>
      <ul id="own-list"></ul>
      <p id="own-empty" class="empty" data-i18n="own_empty" hidden></p>
      <form id="add-form" class="form-grid">
        <span class="field">
          <label for="new-day" data-i18n="add_label"></label>
          <input id="new-day" autocomplete="off" data-i18n-placeholder="date_hint">
        </span>
        <button id="add" type="submit" class="primary" data-i18n="add_button"></button>
      </form>
    </section>

    <section id="sources" class="sources">
      <h2 data-i18n="sources_title"></h2>
      <div id="sources-list"></div>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
