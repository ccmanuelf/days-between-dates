# docker compose up --build, then open http://127.0.0.1:8000
# With port 8000 taken on your machine: DBD_PORT=8765 docker compose up --build, then http://127.0.0.1:8765
# The own holidays and the language choice live in the named volume app-data, so they survive a restart;
# docker compose down -v deletes them.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${DBD_PORT:-8000}:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
